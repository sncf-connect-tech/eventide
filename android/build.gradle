group 'sncf.connect.tech.eventide'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.8.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'jacoco'

// AGP 9 provides built-in Kotlin support, so the Kotlin Gradle Plugin must not be
// applied there. Older AGP versions have no built-in Kotlin, so KGP is still needed.
// See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
//
// `pluginManager.apply` is used instead of `apply plugin:` on purpose: the Flutter Gradle
// plugin detects KGP usage by regex-matching this file's text, and an `apply plugin:` line
// would be reported even though it never runs on AGP 9.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    pluginManager.apply('kotlin-android')
}

android {
    compileSdk 35

    if (project.android.hasProperty("namespace")) {
        namespace 'sncf.connect.tech.eventide'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation "io.mockk:mockk:1.13.13"
        testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }

        unitTests.returnDefaultValues = true
    }
    ndkVersion '27.0.12077973'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        xml.outputLocation.set(file("$project.projectDir/build/reports/jacocoTestReport.xml"))
        html.required = true
        html.outputLocation.set(file("$project.projectDir/build/reports/html"))
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
    ] // ignore pigeon generated files
    def mainSrc = "${project.projectDir}/src/main/kotlin/sncf/connect/tech/eventide/"

    sourceDirectories.setFrom(files(mainSrc))
    classDirectories.setFrom(files("${rootProject.buildDir}/${project.name}/tmp/kotlin-classes/debug/").asFileTree.matching {
        exclude fileFilter
    })
    executionData.setFrom(files("${rootProject.buildDir}/${project.name}/jacoco/testDebugUnitTest.exec"))
}

tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

dependencies {
    implementation("androidx.activity:activity-ktx:1.10.1")
    implementation("androidx.fragment:fragment-ktx:1.8.6")
}
