name: eventide
description: "Provides a easy-to-use flutter interface to access & modify native device calendars (iOS & Android)"
version: 2.4.1
repository: https://github.com/sncf-connect-tech/eventide
resolution: workspace

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

workspace:
  - example

dependencies:
  flutter:
    sdk: flutter
  eventide_platform_interface: ^1.0.0
  eventide_ios: ^1.0.0
  eventide_android: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: eventide_android
      ios:
        default_package: eventide_ios

topics:
  - flutter
  - calendar
  - api
  - native
  - eventide

keywords:
  - flutter
  - calendar
  - api
  - native
  - eventide
  - sncf
  - plugin
  - mobile
  - event management
  - calendar integration
  - cross-platform
  - reminders
  - event scheduling
  - date management
  - time management
  - flutter plugin
  - calendar events
  - calendar API
  - iOS calendar
  - Android calendar
  - iOS 17 write-only permission
